      <stop offset="0%" stop-color="#ffeef5" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ff5599" stop-opacity="0.15"/>
      <stop offset="72%" stop-color="#ff5599" stop-opacity="0.85"/>
      <stop offset="86%" stop-color="#dd0044" stop-opacity="0.95"/>
