<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="50%" stop-color="#151320"/>
      <stop offset="100%" stop-color="#0d0c14"/>
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7cc" stop-opacity="1.0"/>
      <stop offset="25%" stop-color="#ffbb33" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ff5500" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#cc1100" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#660000" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="35%" stop-color="#ffcc33" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#ff5500" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#aa0000" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="dropShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad)" stroke="#ff7722" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Comet-Fire Trail Arc -->
  <circle cx="52" cy="186" r="7" fill="url(#orbGlow)" opacity="0.35"/>
  <circle cx="44" cy="160" r="10" fill="url(#orbGlow)" opacity="0.48"/>
  <circle cx="45" cy="132" r="13" fill="url(#orbGlow)" opacity="0.62"/>
  <circle cx="56" cy="104" r="17" fill="url(#orbGlow)" opacity="0.76"/>
  <circle cx="76" cy="82" r="22" fill="url(#orbGlow)" opacity="0.88"/>
  <circle cx="102" cy="70" r="27" fill="url(#orbGlow)" opacity="0.95"/>

  <!-- Fire-Breathing Halo at Cursor Tip -->
  <circle cx="128" cy="72" r="56" fill="url(#haloGlow)"/>

  <!-- Enlarged Dynamic Mouse Pointer -->
  <g transform="translate(98, 48) scale(1.95)" filter="url(#dropShadow)">
    <path
      d="M 16 12
         L 16 68
         L 30.5 54.5
         L 41.5 77.5
         C 42.8 80.2 46.0 81.3 48.7 80.0
         C 51.4 78.7 52.5 75.5 51.2 72.8
         L 40.2 49.8
         L 60 49.8
         Z"
      fill="#18181b"
      stroke="#ffffff"
      stroke-width="4.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>
</svg>
